<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Prompts AARPIA</title>
    <style>
        :root {
            --sidebar-bg: #202123;
            --sidebar-hover: #2a2b32;
            --main-bg: #343541;
            --panel-bg: #444654;
            --text-main: #ececf1;
            --text-muted: #8e8ea0;
            --primary: #10a37f;
            --primary-hover: #1a7f64;
            --border: #4d4d4f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--main-bg);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Sidebar (Estilo ChatGPT) */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            padding: 0.5rem;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .new-chat-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .new-chat-btn:hover { background-color: var(--sidebar-hover); }

        .history-list {
            flex-grow: 1;
            overflow-y: auto;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        /* Ocultar scrollbar visualmente pero permitir scroll */
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }

        .history-item {
            padding: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--sidebar-hover);
        }

        .history-item svg { flex-shrink: 0; width: 16px; height: 16px; fill: currentColor; }
        
        .delete-btn {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: none;
        }
        .history-item:hover .delete-btn { display: block; }
        .delete-btn:hover { color: #ef4444; }

        /* Main Content */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: #fff; }
        p.subtitle { color: var(--text-muted); font-size: 1rem; margin-bottom: 2rem; }

        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); }

        textarea {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            padding: 1rem;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 1rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        textarea:focus { outline: none; border-color: var(--primary); }

        #userInput { min-height: 150px; }
        #finalPrompt { min-height: 250px; background: #2a2b32; font-family: monospace; font-size: 0.85rem; }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }
        button.primary-btn:hover { background: var(--primary-hover); }

        .result-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: none;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: -50px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: bottom 0.3s ease-in-out;
            z-index: 1000;
        }
        .toast.show { bottom: 20px; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn" onclick="createNewPrompt()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Nueva Solicitud
        </button>
        <ul class="history-list" id="historyList">
            </ul>
    </aside>

    <main class="main-content">
        <div class="container">
            <h1>Generador de Prompts AARPIA</h1>
            <p class="subtitle">Describe la interfaz. Se unirá automáticamente con las reglas de negocio y se copiará a tu portapapeles.</p>

            <div class="input-section">
                <label for="userInput">Describe la aplicación, vista o proceso:</label>
                <textarea id="userInput" placeholder="Ej: Un panel de control para un taller mecánico donde se aprueban presupuestos y se marcan vehículos como reparados. Debe verse industrial pero moderno..."></textarea>
                
                <button class="primary-btn" onclick="generateAndCopy()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Generar y Copiar Prompt
                </button>
            </div>

            <div class="result-section" id="resultSection">
                <label>Prompt Generado (Ya está en tu portapapeles):</label>
                <textarea id="finalPrompt" readonly></textarea>
                <button class="primary-btn" style="background: #444654; border: 1px solid #555;" onclick="copyToClipboardOnly()">
                    Copiar de nuevo
                </button>
            </div>
        </div>
    </main>

    <div id="toast" class="toast">¡Prompt copiado al portapapeles! 📋</div>

    <script>
        // EL PROMPT MAESTRO (Intocable)
        const MASTER_PROMPT = `Eres un desarrollador UI/UX y frontend senior. Tu trabajo es crear MOCKUPS INTERACTIVOS DE ALTA FIDELIDAD para presentar a clientes. 
La aplicación debe verse y sentirse como si estuviera en producción, utilizando internamente la lógica de la máquina de estados "AARPIA", pero TOTALMENTE SIMULADA en el navegador (LocalStorage), sin conexiones a backend, Relays, ni pagos reales.
Generas una ÚNICA página HTML completa, autónoma y 100% funcional a nivel de interfaz.

# REGLAS ABSOLUTAS (LEER ANTES DE ESCRIBIR UNA SOLA LÍNEA):

1. **UN SOLO ARCHIVO HTML** — Todo (HTML + CSS + JS) en un archivo.
2. **SOLO CSS VANILLA** — PROHIBIDO usar TailwindCSS, Bootstrap, o frameworks CSS vía CDN. Escribe TODO el CSS a mano con <style>. Usa CSS moderno (custom properties, flexbox, grid, animations). Única excepción: librerías funcionales JS (Chart.js, canvas confetti, etc.) vía CDN.
3. **DISEÑO ÚNICO Y ORIGINAL (EFECTO WOW)** — La interfaz debe impresionar al cliente:
   - Identidad visual PROPIA acorde a su dominio.
   - Micro-animaciones CSS en hover, transiciones suaves, esqueletos de carga (skeleton loaders).
   - Iconos: SVG INLINE obligatorios. NO USAR EMOJIS COMO ICONOS.
   - Layout responsive estricto, perfecto tanto en móvil como en escritorio.
   - Notificaciones toast caseras con animaciones CSS para dar feedback.
4. **SIMULACIÓN DE RED** — Añade pequeños retrasos (setTimeout de 500ms - 1s) al hacer clic en botones de acción para simular llamadas al servidor.
5. **NUNCA MENCIONES "AARPIA", "HASHES", "STATE MACHINE" NI TÉRMINOS TÉCNICOS EN LA UI.** Traduce la lógica de estados al lenguaje natural (ej. "Enviado a revisión").
6. **MARKETPLACE SCOPING (MULTI-TENANCY)**: Al iniciar, verifica en localStorage si existe un mobi_scope. Si no, genera uno de 6 caracteres. Filtra todo por este scope.

# EL MOTOR AARPIA (SIMULADO EN LOCALSTORAGE - OBLIGATORIO):
En lugar de enviar mensajes a un Relay, DEBES programar un pequeño "Motor AARPIA Local" en JavaScript dentro del <script>. Cada proceso DEBE tener estos 10 campos: instance_hash, entity_name, context_name, genesis_hash, owner_did, trigger_hash, current_state, target_state, version ("1.0.0"), actions_log (Array de acciones).

## Ciclo de Vida del Motor Simulado:
1. **Creación**: Crea el objeto, guarda los datos en actions_log y a localStorage.
2. **Transiciones**: Al cambiar de estado, añade al actions_log.
3. **Cierre automático (LACRADO)**: Si current_state === target_state, el objeto se "lacra" (sealed: true) y se le genera un seal_hash falso.
4. **Persistencia**: Guarda en localStorage.getItem('aarpia_mock_db').

AUTENTICACIÓN Y PAGOS (SIMULADOS):
Muestra un login atractivo. Genera un mock_user_id falso. Si requiere dinero, inventa un saldo local (localStorage.setItem('mock_balance', 150000)). NADA DE WEBLN REAL.`;

        // Estado y base de datos local
        let history = JSON.parse(localStorage.getItem('aarpia_prompt_history')) || [];
        let currentId = null;

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            renderHistory();
            if(history.length > 0) {
                loadHistoryItem(history[0].id);
            }
        });

        // Generar, Copiar y Guardar
        function generateAndCopy() {
            const inputEl = document.getElementById('userInput');
            const requestText = inputEl.value.trim();
            
            if (!requestText) {
                alert("Por favor, escribe una descripción primero.");
                inputEl.focus();
                return;
            }

            // Construir el prompt final
            const finalPromptText = `${MASTER_PROMPT}\n\n--- SOLICITUD ESPECÍFICA DEL CLIENTE ---\n${requestText}`;
            
            // Mostrar en UI
            document.getElementById('finalPrompt').value = finalPromptText;
            document.getElementById('resultSection').style.display = 'block';

            // Copiar al portapapeles
            copyToClipboard(finalPromptText);

            // Guardar en el historial
            saveToHistory(requestText, finalPromptText);
        }

        // Solo copiar lo que ya está en la caja de texto final
        function copyToClipboardOnly() {
            const text = document.getElementById('finalPrompt').value;
            copyToClipboard(text);
        }

        // Utilidad para copiar y mostrar el Toast
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast();
            }).catch(err => {
                console.error('Error al copiar: ', err);
                // Fallback para navegadores antiguos
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("Copy");
                textArea.remove();
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // Gestión del Historial
        function saveToHistory(userInput, finalPrompt) {
            // Generar título corto basado en el input
            let title = userInput.substring(0, 30).replace(/\n/g, " ");
            if (userInput.length > 30) title += "...";

            if (currentId) {
                // Actualizar existente
                const itemIndex = history.findIndex(h => h.id === currentId);
                if(itemIndex > -1) {
                    history[itemIndex].input = userInput;
                    history[itemIndex].prompt = finalPrompt;
                    history[itemIndex].title = title;
                }
            } else {
                // Crear nuevo
                const newItem = {
                    id: Date.now().toString(),
                    title: title,
                    input: userInput,
                    prompt: finalPrompt,
                    date: new Date().toLocaleString()
                };
                history.unshift(newItem); // Añadir al principio
                currentId = newItem.id;
            }

            localStorage.setItem('aarpia_prompt_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            history.forEach(item => {
                const li = document.createElement('li');
                li.className = `history-item ${item.id === currentId ? 'active' : ''}`;
                
                // Icono de mensaje
                const icon = `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;
                
                li.innerHTML = `
                    ${icon}
                    <span style="flex-grow: 1; overflow: hidden; text-overflow: ellipsis;">${item.title}</span>
                    <button class="delete-btn" onclick="deleteHistoryItem(event, '${item.id}')" title="Borrar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    </button>
                `;
                
                li.onclick = () => loadHistoryItem(item.id);
                list.appendChild(li);
            });
        }

        function loadHistoryItem(id) {
            const item = history.find(h => h.id === id);
            if (!item) return;

            currentId = id;
            document.getElementById('userInput').value = item.input;
            document.getElementById('finalPrompt').value = item.prompt;
            document.getElementById('resultSection').style.display = 'block';
            
            renderHistory(); // Actualizar clase 'active'
        }

        function createNewPrompt() {
            currentId = null;
            document.getElementById('userInput').value = '';
            document.getElementById('finalPrompt').value = '';
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('userInput').focus();
            renderHistory(); // Quitar clase 'active'
        }

        function deleteHistoryItem(event, id) {
            event.stopPropagation(); // Evitar que dispare loadHistoryItem
            if(confirm('¿Eliminar este prompt del historial?')) {
                history = history.filter(h => h.id !== id);
                localStorage.setItem('aarpia_prompt_history', JSON.stringify(history));
                
                if(currentId === id) {
                    createNewPrompt();
                } else {
                    renderHistory();
                }
            }
        }
    </script>
</body>
</html>
