<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista de la Aplicación</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f4f7f6; }
        #pantalla-carga { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; color: #64748b; font-size: 1.2rem;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6; 
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="pantalla-carga">
        <div class="spinner"></div>
        <div>Cargando entorno interactivo...</div>
    </div>
    <div id="app-container" style="display: none; height: 100vh; width: 100%;"></div>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const idBytebin = parametros.get('id');

        if (idBytebin) {
            fetch(`https://bytebin.lucko.me/${idBytebin}`)
                .then(respuesta => {
                    if (!respuesta.ok) throw new Error("Documento no encontrado");
                    return respuesta.text(); // Leemos HTML crudo
                })
                .then(html => {
                    document.getElementById('pantalla-carga').style.display = 'none';
                    const container = document.getElementById('app-container');
                    container.style.display = 'block';
                    container.innerHTML = html;

                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
                        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                })
                .catch(error => {
                    document.getElementById('pantalla-carga').innerHTML = "❌ Error: El enlace a este prototipo ya no es válido.";
                });
        } else {
            document.getElementById('pantalla-carga').innerHTML = "⚠️ Error: Falta el ID en la URL.";
        }
    </script>
</body>
</html>
